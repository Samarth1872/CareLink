<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CareLoop — From diagnosis to control</title>
<style>
:root{--ink:#12343b;--bg:#f5f7f4;--card:#fff;--mut:#5b6b70;--line:#dbe3e0;--acc:#0e7c7b;--hi:#b3261e;--hib:#fde8e6;--at:#a85a00;--atb:#fff0d9;--ok:#1b6e3a;--okb:#e2f4e8;--r:16px}
@media(prefers-color-scheme:dark){:root{--ink:#e8f0ee;--bg:#0f1b1d;--card:#182629;--mut:#9db0b3;--line:#2a3c40;--acc:#4fd1c5;--hib:#4a1e1b;--atb:#4a3510;--okb:#173a25;--hi:#ff8a80;--at:#ffb74d;--ok:#7bd99a}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Kannada","Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--acc)}h1,h2,h3{line-height:1.2;margin:.2em 0 .5em}button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px 96px}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}.stat b{display:block;font-size:2rem}.stat span{color:var(--mut)}
.btn{min-height:48px;padding:0 20px;border-radius:12px;border:2px solid var(--acc);background:var(--acc);color:#fff;font-weight:600;cursor:pointer}.btn.o{background:transparent;color:var(--acc)}.btn.s{min-height:40px;padding:0 14px}
:focus-visible{outline:3px solid #f5a623;outline-offset:2px}
input,select,textarea{width:100%;min-height:48px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);margin:4px 0 12px}label{font-weight:600;font-size:.9rem}
.b{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:700}.HIGH,.Overdue{background:var(--hib);color:var(--hi)}.ATTENTION,.Due{background:var(--atb);color:var(--at)}.STABLE,.ok{background:var(--okb);color:var(--ok)}.Upcoming{background:#fff6c9;color:#6b5600}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--ink);color:var(--bg);position:sticky;top:0;z-index:5;flex-wrap:wrap}.top a,.top button,.top select{color:inherit}.logo{font-weight:800;font-size:1.2rem;text-decoration:none;color:inherit}
.pill{border:1px solid currentColor;border-radius:99px;padding:2px 10px;background:none;cursor:pointer;font-size:.85rem;min-height:32px}
.side{display:none}nav.bot{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px;z-index:5}nav.bot a{text-decoration:none;text-align:center;font-size:.75rem;color:var(--ink);min-width:56px;padding:4px}nav.bot a.plus{background:var(--acc);color:#fff;border-radius:50%;width:52px;height:52px;line-height:44px;font-size:1.6rem;margin-top:-22px}
@media(min-width:800px){.side{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}.side a{padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--ink)}.side a.on{background:var(--acc);color:#fff}nav.bot{display:none}}
.hero{background:var(--ink);color:var(--bg);padding:56px 16px;text-align:center}.hero h1{font-size:clamp(2.2rem,7vw,4rem);margin:0}.loop{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:24px 0}.loop span{background:rgba(255,255,255,.12);padding:6px 12px;border-radius:99px}
.tl{border-left:3px solid var(--acc);margin-left:8px;padding-left:14px}.tl div{margin-bottom:12px}.tl small{color:var(--mut)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}.mut{color:var(--mut)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:9;max-width:90%}.err{background:var(--hib);color:var(--hi);padding:10px;border-radius:12px;margin:8px 0}.warn{background:var(--atb);color:var(--at);padding:10px;border-radius:12px;margin:8px 0}
.demo{font-size:.75rem;text-align:center;padding:4px;background:#fff6c9;color:#5a4a00}svg{max-width:100%;height:auto}.bar{height:12px;background:var(--acc);border-radius:6px}
</style></head><body>
<div class="demo">DEMO DATA — NOT REAL PATIENT INFORMATION · Prototype care-coordination tool, not a medical device</div>
<div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),root=$('#app');
let T=sessionStorage.getItem('t'),U=JSON.parse(sessionStorage.getItem('u')||'null'),SEARCH='',FILTER='';
const esc=s=>String(s??'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();
const LBL={HIGH:'🔴 HIGH PRIORITY',ATTENTION:'🟠 ATTENTION',STABLE:'🟢 STABLE'};
const badge=l=>`<span class="b ${l}">${LBL[l]||l}</span>`;
const stbadge=s=>`<span class="b ${s.split(' ')[0]}">${{Overdue:'🔴 Overdue','Due today':'🟠 Due today',Upcoming:'🟡 Upcoming'}[s]}</span>`;
const medb=m=>({Available:'🟢 Available','Running low':'🟠 Running low','Not available':'🔴 Not available'}[m]||'❔ '+m);
function toast(m){const t=$('#toast');t.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;setTimeout(()=>t.innerHTML='',3200)}
// ---- API + offline queue ----
let Q=JSON.parse(localStorage.getItem('cl_queue')||'[]'),FAILED=0,LAST=localStorage.getItem('cl_last')||'—',SYNCING=false;
const saveQ=()=>localStorage.setItem('cl_queue',JSON.stringify(Q));
async function api(m,u,b){let r;try{r=await fetch('/api'+u,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b&&JSON.stringify(b)})}catch(e){throw{offline:true,error:'You appear to be offline. Your changes will sync when connectivity returns.'}}
 const j=await r.json().catch(()=>({error:'Something went wrong. Please try again.'}));if(r.status===401&&T){logout();toast(j.error);throw j}if(!r.ok)throw j;return j}
async function saveOrQueue(m,u,b){b.clientId=b.clientId||uid();try{return await api(m,u,b)}catch(e){if(e.offline){Q.push({m,u,b});saveQ();syncUI();toast('Saved offline — will sync automatically.');return{queued:true,warnings:[]}}throw e}}
async function sync(){if(SYNCING||!Q.length||!navigator.onLine)return;SYNCING=true;syncUI();toast(`🔄 Syncing ${Q.length} updates...`);const rest=[];for(const it of Q){try{await api(it.m,it.u,it.b)}catch(e){rest.push(it)}}Q=rest;saveQ();FAILED=rest.length;SYNCING=false;if(!rest.length){LAST=new Date().toLocaleTimeString();localStorage.setItem('cl_last',LAST);toast('✓ All changes synchronized')}else toast(`⚠️ ${rest.length} updates could not be synchronized.`);syncUI()}
addEventListener('online',()=>{syncUI();sync()});addEventListener('offline',syncUI);
function syncUI(){const e=$('#sync');if(!e)return;const off=!navigator.onLine;e.textContent=off?'📵 Offline':FAILED?'🔴 Sync error':SYNCING?'🟠 Syncing':Q.length?`🟠 ${Q.length} pending`:'🟢 Synced'}
function syncPanel(){alert(`Synchronization Status\n\nLast successful sync: ${LAST}\nPending updates: ${Q.length}\nFailed updates: ${FAILED}\n\n${navigator.onLine?'':'📵 Offline mode: changes are stored locally and synchronized when connectivity returns.'}`);if(Q.length)sync()}
// ---- shell ----
const NAV={asha:[['dash','🏠','Dashboard'],['patients','👥','Patients'],['priority','🔴','Priority'],['followups','🔔','Follow-ups'],['referrals','📨','Referrals'],['notes','🔔','Notifications'],['profile','🙂','Profile']],
 phc:[['dash','🏠','Dashboard'],['patients','👥','Patients'],['queue','📋','Review Queue'],['referrals','📨','Referrals'],['workers','🧑‍⚕️','ASHA Workers'],['gaps','📡','Care Gaps'],['meds','💊','Medicine Issues'],['analytics','📊','Analytics'],['notes','🔔','Notifications'],['profile','🙂','Profile']]};
function shell(html,cur){const n=NAV[U.role],h=new Date().getHours(),g=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
 root.innerHTML=`<header class="top"><a class="logo" href="#/dash">🔁 CareLoop</a><span style="flex:1">${U.role==='asha'?`${g}, ${esc(U.name.split(' ')[0])} 👋`:'PHC Care Dashboard'}</span><button class="pill" id="sync" onclick="syncPanel()"></button><select aria-label="Language" id="lang"><option>English</option><option>ಕನ್ನಡ</option><option>हिन्दी</option></select><a href="#/notes" aria-label="Notifications">🔔</a><button class="pill" onclick="logout()">Log out</button></header>
 <nav class="side" aria-label="Main">${n.map(x=>`<a href="#/${x[0]}" class="${cur===x[0]?'on':''}">${x[1]} ${x[2]}</a>`).join('')}</nav>
 <main class="wrap"><p class="mut" style="margin:0 0 8px">${esc(U.id)} · ${esc(U.phcName)}${U.village?' · '+esc(U.village):''} · <em>A diagnosis is only the beginning.</em></p>${html}</main>
 <nav class="bot" aria-label="Mobile"><a href="#/dash">🏠<br>Dashboard</a><a href="#/patients">👥<br>Patients</a><a href="#/followups">🔔<br>Tasks</a>${U.role==='asha'?'<a class="plus" href="#/register" aria-label="Register / Add Visit">➕</a>':''}<a href="#/${U.role==='asha'?'profile':'queue'}">☰<br>More</a></nav>`;syncUI()}
function logout(){T=null;U=null;sessionStorage.clear();location.hash='#/login';route()}
const empty=(m='No patients match your filters.')=>`<div class="card mut" style="text-align:center">🗂️ ${m}</div>`;
const errS=(e,r)=>`<div class="err" role="alert">${esc(e.error||'Something went wrong. Please try again.')} <button class="btn s o" onclick="${r}">Retry</button></div>`;
const load=()=>`<div class="card mut">Loading…</div>`;
// ---- cards ----
const pcard=p=>`<a class="card" style="display:block;text-decoration:none;color:inherit" href="#/p/${p.id}"><div class="row"><b>${esc(p.name)}</b>${badge(p.level)}</div><div class="mut">${p.id} · ${p.age}y · ${p.diagnosis?'PHC-confirmed: '+esc(p.diagnosis):'Under screening'}</div>
<div class="row" style="margin-top:6px"><span>BP <b>${p.bp}</b></span><span>Glucose <b>${p.glucose}</b></span><span>💊 ${medb(p.med)}</span></div>
<div class="mut">Last visit ${p.lastVisit} · Next follow-up ${p.nextFollowUp||'—'}</div><div style="margin-top:6px"><small><b>Why is this patient here?</b> ${esc(p.reasons[0])}</small></div>${p.gap?`<div class="warn">🔴 Care gap detected: ${esc(p.gap)}</div>`:''}</a>`;
const fcard=p=>`<div class="card"><div class="row"><b>${esc(p.name)}</b>${stbadge(p.state)}</div><div class="mut">${p.id} · ${esc(p.purpose)} · Due ${p.nextFollowUp}</div><a class="btn s" style="display:inline-flex;align-items:center;margin-top:8px;text-decoration:none" href="#/p/${p.id}">Open Patient</a></div>`;
const stat=(n,l)=>`<div class="card stat"><b>${n}</b><span>${l}</span></div>`;
function chart(pts,keys,title,unit){if(!pts.length)return`<div class="card mut">No ${title} readings yet.</div>`;const W=320,H=140,all=pts.flatMap(p=>keys.map(k=>p[k])),mn=Math.min(...all)-10,mx=Math.max(...all)+10,x=i=>20+i*(W-30)/Math.max(pts.length-1,1),y=v=>H-15-(v-mn)*(H-30)/(mx-mn),cols=['#0e7c7b','#d1761a'];
 return`<div class="card"><b>${title}</b> <small class="mut">(${unit})</small><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title} trend">${keys.map((k,j)=>`<polyline fill="none" stroke="${cols[j]}" stroke-width="2.5" points="${pts.map((p,i)=>x(i)+','+y(p[k])).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p[k])}" r="3" fill="${cols[j]}"/>`).join('')}`).join('')}<text x="4" y="12" font-size="9" fill="currentColor">${mx}</text><text x="4" y="${H-16}" font-size="9" fill="currentColor">${mn}</text></svg><small class="mut">${keys.map((k,j)=>`<span style="color:${cols[j]}">●</span> ${k}`).join(' ')} · ${pts[0].date} → ${pts[pts.length-1].date}</small></div>`}
function timeline(t){return`<div class="tl">${[...t].reverse().map(e=>`<div><b>${esc(e.type)}</b><br><small>${e.date} · Recorded by ${esc(e.by)}${e.note?' · '+esc(e.note):''}</small></div>`).join('')}</div>`}
const loopBar=()=>`<div class="loop" style="margin:8px 0"><span>Patient → ASHA → CareLoop → PHC → ASHA → Patient</span></div>`;
// ---- pages ----
function landing(){root.innerHTML=`<section class="hero"><p>🔁 CARELOOP</p><h1>From diagnosis to control.</h1><p style="max-width:560px;margin:12px auto">Helping ASHA workers and PHCs keep chronic-care patients connected to monitoring, treatment and follow-up.</p><div class="loop"><span>Patient</span>→<span>ASHA</span>→<span>PHC</span>→<span>Follow-up</span>→<span>Monitoring</span>→<span>Continued Care</span></div>
<a class="btn" href="#/login?demo=1" style="display:inline-flex;align-items:center;text-decoration:none;background:#fff;color:#12343b;border-color:#fff">Explore Demo</a> <a class="btn o" href="#/login" style="display:inline-flex;align-items:center;text-decoration:none;color:#fff;border-color:#fff">Login</a><p style="margin-top:24px"><em>A diagnosis is only the beginning. Screen. Connect. Monitor. Follow up. Continue care.</em></p></section>
<div class="wrap"><div class="grid g2"><div class="card"><h3>👩‍⚕️ For ASHA Workers</h3>Know who needs attention.</div><div class="card"><h3>🏥 For PHCs</h3>Know which patients need clinical review.</div><div class="card"><h3>🧑‍🤝‍🧑 For Patients</h3>Stay connected to treatment and follow-up.</div></div>
<h2 style="margin-top:32px">CareLoop doesn't replace ASHA workers or doctors. It connects them.</h2><div class="grid g2"><div class="card"><b>ASHA</b><br>Collects community information</div><div class="card"><b>CareLoop</b><br>Organizes follow-up and care gaps</div><div class="card"><b>PHC</b><br>Makes clinical decisions</div><div class="card"><b>ASHA</b><br>Continues community follow-up</div></div>
<p class="mut">CareLoop closes the gap between diagnosis and control. Priorities shown are care-coordination signals, never diagnoses.</p></div>`}
function login(){const demo=location.hash.includes('demo');root.innerHTML=`<div class="wrap" style="max-width:420px"><h1>🔁 CareLoop</h1><p class="mut">From diagnosis to control.</p><form class="card" id="lf"><label>Role</label><select id="role"><option value="asha">ASHA Worker</option><option value="phc">PHC / Healthcare Professional</option></select><label>Mobile / Worker ID</label><input id="wid" autocomplete="username" required><label>Password</label><input id="pw" type="password" autocomplete="current-password" required><label style="font-weight:400"><input type="checkbox" style="width:auto;min-height:0;margin-right:8px">Remember this device</label><div id="le"></div><button class="btn" style="width:100%">Login</button><p><a href="#/login" onclick="alert('Prototype: password reset is not available.')">Forgot password?</a></p></form>
<div class="card" style="margin-top:12px"><b>Demo credentials (fictional)</b><p>Demo ASHA — Worker ID: <code>ASHA001</code> · Password: <code>demo1234</code><br>Demo PHC — Worker ID: <code>PHC001</code> · Password: <code>demo1234</code></p><button class="btn s o" id="fa">Fill ASHA</button> <button class="btn s o" id="fp">Fill PHC</button></div><p><a href="#/">← Back</a></p></div>`;
 const fill=(r,i)=>{$('#role').value=r;$('#wid').value=i;$('#pw').value='demo1234'};$('#fa').onclick=()=>fill('asha','ASHA001');$('#fp').onclick=()=>fill('phc','PHC001');
 $('#lf').onsubmit=async e=>{e.preventDefault();try{const r=await api('POST','/login',{id:$('#wid').value,password:$('#pw').value,role:$('#role').value});T=r.token;U=r.user;sessionStorage.setItem('t',T);sessionStorage.setItem('u',JSON.stringify(U));location.hash='#/dash';route();sync()}catch(er){$('#le').innerHTML=`<div class="err" role="alert">${esc(er.error)}</div>`}}}
async function dash(){shell(load(),'dash');try{const d=await api('GET','/dashboard'),s=d.stats;let h=loopBar();
 if(U.role==='asha'){const pr=await api('GET','/patients?filter=high');h+=`<div class="grid">${stat(s.total,'Total Patients')}${stat(s.due,'Follow-ups Due')}${stat(s.attention,'Needs Attention')}${stat(s.stable,'Stable')}${stat(s.medIssues,'Medicine Issues')}${stat(s.referrals,'PHC Referrals')}</div><div class="row" style="margin:16px 0"><h2>Who needs attention today</h2><a class="btn" href="#/register" style="text-decoration:none;display:inline-flex;align-items:center">+ Register New Patient</a></div><div class="grid g2">${pr.slice(0,6).map(pcard).join('')||empty()}</div>`}
 else{h+=`<div class="grid">${stat(s.total,'Chronic-care patients')}${stat(s.review,'Awaiting review')}${stat(s.due,'Follow-ups due')}${stat(s.overdue,'Overdue')}${stat(s.referrals,'Referrals pending')}${stat(s.medIssues,'Medicine issues')}</div>`+analyticsHTML(d)}
 shell(h,'dash')}catch(e){shell(errS(e,'route()'),'dash')}}
function analyticsHTML(d){const o=d.overview;return`<h2 style="margin-top:20px">Community Care Overview <span class="b ATTENTION">DEMO DATA</span></h2><div class="grid">${stat(o.controlled+'%','Continuing care / recent monitoring')}${stat(o.monitoring+'%','Needs monitoring')}${stat(o.review+'%','Needs clinical review')}</div>
<h3 style="margin-top:20px">Why are patients falling out of care? <span class="b ATTENTION">DEMO DATA</span></h3><div class="card">${d.reasons.map(r=>`<div>${esc(r[0])} — ${r[1]}%<div class="bar" style="width:${r[1]}%"></div></div>`).join('')||'No care-gap reasons recorded.'}</div>
<h3 style="margin-top:20px">Community care-gap map (aggregate only)</h3><div class="grid">${d.areas.map(a=>{const f=a.patients?a.gaps/a.patients:0,c=f>.25?'🔴 High unresolved care-gap concentration':f>.1?'🟠 Follow-up gaps':'🟢 Good follow-up coverage';return`<button class="card" style="text-align:left;cursor:pointer" onclick="alert('${esc(a.village)}\\nPatients: ${a.patients}\\nCare gaps: ${a.gaps}\\nOverdue follow-ups: ${a.overdue}\\n(Aggregate statistics only)')"><b>${esc(a.village)}</b><br>${c}</button>`}).join('')}</div>
<h3 style="margin-top:20px">ASHA workload <small class="mut">(support tool — not a ranking)</small></h3><div class="grid g2">${d.workload.map(w=>`<div class="card"><b>${esc(w.name)}</b> · ${esc(w.village)}<br>Patients ${w.patients} · Due ${w.due} · Overdue ${w.overdue} · Pending referrals ${w.referrals} · Visits this week ${w.visits}</div>`).join('')}</div>`}
async function patients(pre){shell(`<h1>Patients</h1><input id="q" placeholder="Search name, Patient ID or phone" value="${esc(SEARCH)}"><select id="fl" aria-label="Filter"><option value="">All patients</option><option value="HTN">Hypertension</option><option value="DM">Diabetes</option><option value="BOTH">Both</option><option value="high">High priority</option><option value="due">Follow-up due</option><option value="med">Medicine issue</option><option value="referral">Referral pending</option><option value="monitoring">Monitoring overdue</option></select><div id="pl">${load()}</div>`,pre?'priority':'patients');
 $('#fl').value=pre||FILTER;const go=async()=>{SEARCH=$('#q').value;FILTER=$('#fl').value;try{const l=await api('GET',`/patients?q=${encodeURIComponent(SEARCH)}&filter=${pre||FILTER}`);$('#pl').innerHTML=l.length?`<div class="grid g2">${l.map(pcard).join('')}</div>`:empty()}catch(e){$('#pl').innerHTML=errS(e,'route()')}};$('#q').oninput=go;$('#fl').onchange=go;go()}
async function followups(){shell(`<h1>My Follow-ups</h1>${load()}`,'followups');try{const l=await api('GET','/followups'),g=s=>l.filter(x=>x.state===s);shell(`<h1>My Follow-ups</h1><div class="grid">${stat(g('Due today').length,'Due today')}${stat(g('Upcoming').length,'Upcoming')}${stat(g('Overdue').length,'Overdue')}</div>${['Overdue','Due today','Upcoming'].map(s=>`<h3>${s}</h3><div class="grid g2">${g(s).map(fcard).join('')||empty('Nothing here.')}</div>`).join('')}`,'followups')}catch(e){shell(errS(e,'route()'),'followups')}}
async function queue(){shell(`<h1>PHC Review Queue</h1>${load()}`,'queue');try{const l=await api('GET','/queue');shell(`<h1>PHC Review Queue</h1>${l.map(p=>`<div class="card" style="margin-bottom:8px"><div class="row"><b>${esc(p.name)}</b><span class="b ATTENTION">🟠 PHC review required</span></div><div class="mut">Patient ID: ${p.id} · BP ${p.bp} · Glucose ${p.glucose}</div><div>Reason: ${esc(p.referralFull?p.referralFull.reason:'Elevated screening reading — clinical assessment required.')}</div>${p.referralFull?`<div class="mut">Referral status: ${p.referralFull.status}</div>`:''}<a class="btn s" style="display:inline-flex;align-items:center;margin-top:8px;text-decoration:none" href="#/p/${p.id}">Review Patient</a></div>`).join('')||empty('Queue is clear.')}`,'queue')}catch(e){shell(errS(e,'route()'),'queue')}}
async function referrals(){if(U.role==='phc')return queue();shell(load(),'referrals');try{const l=await api('GET','/patients?filter=referral'),steps=['Created','Sent','Acknowledged','Reviewed','Completed'];shell(`<h1>Referrals</h1>${l.map(p=>`<div class="card" style="margin-bottom:8px"><b>${esc(p.name)}</b> · ${p.id}<br>Status: <b>${p.referral}</b> <small class="mut">(${steps.join(' → ')})</small><br><a href="#/p/${p.id}">Open Patient</a></div>`).join('')||empty('No pending referrals.')}`,'referrals')}catch(e){shell(errS(e,'route()'),'referrals')}}
async function gaps(){shell(load(),'gaps');try{const l=(await api('GET','/patients')).filter(p=>p.gap);shell(`<h1>📡 Care Gap Radar</h1><p class="mut">Operational alerts based on prototype rules (no follow-up for over 45 days). Not a clinical prediction.</p>${l.map(p=>`<div class="card" style="margin-bottom:8px"><b>🔴 Care gap detected</b><br>Patient: ${esc(p.name)} (${p.id})<br>Reason: ${esc(p.gap)}<br><a href="#/p/${p.id}">Open Patient</a></div>`).join('')||empty('No care gaps detected.')}`,'gaps')}catch(e){shell(errS(e,'route()'),'gaps')}}
async function meds(){shell(load(),'meds');try{const [d,l]=await Promise.all([api('GET','/dashboard'),api('GET','/patients?filter=med')]);shell(`<h1>Medicine Access Alerts</h1><div class="grid">${stat(d.stats.notMedAvail,'reported medicine unavailable')}${stat(d.stats.low,'reported running low')}</div><p class="mut">Availability monitoring only. CareLoop does not suggest substitutions.</p><div class="grid g2">${l.map(pcard).join('')||empty()}</div>`,'meds')}catch(e){shell(errS(e,'route()'),'meds')}}
async function analytics(){shell(load(),'analytics');try{shell(analyticsHTML(await api('GET','/dashboard')),'analytics')}catch(e){shell(errS(e,'route()'),'analytics')}}
async function notes(){shell(load(),'notes');try{const l=await api('GET','/notifications');shell(`<h1>Notifications</h1>${l.map(n=>`<div class="card" style="margin-bottom:8px"><div class="row"><span>${{high:'🔴',warn:'🟠',ok:'🟢'}[n.level]} ${esc(n.text)}${n.read?'':' <span class="b ATTENTION">Unread</span>'}</span><small class="mut">${new Date(n.t).toLocaleString()}</small></div>${n.pid?`<a href="#/p/${n.pid}">Open patient</a>`:''}</div>`).join('')||empty('No notifications.')}`,'notes');api('POST','/notifications/read')}catch(e){shell(errS(e,'route()'),'notes')}}
function profilePage(){shell(`<h1>Profile</h1><div class="card"><b>${esc(U.name)}</b><br>ID ${esc(U.id)} · ${U.role==='asha'?'ASHA Worker':'PHC / Healthcare Professional'}<br>${esc(U.phcName)}${U.village?'<br>Village: '+esc(U.village):''}<br><small class="mut">Session times out after 30 minutes of inactivity.</small></div><button class="btn o" style="margin-top:12px" onclick="logout()">Log out</button>`,'profile')}
async function workers(){analytics()}
// ---- patient profile ----
async function patient(id){shell(load(),'patients');try{const p=await api('GET','/patients/'+id),phc=U.role==='phc';
 shell(`<a href="#/patients">← Patients</a><h1>${esc(p.name)}</h1><div class="mut">Patient ID: ${p.id} · ${p.age}y · ${esc(p.village)} · Assigned ASHA: ${esc(p.ashaName)} · ${esc(p.phcName)}</div>
 <div class="card" style="margin:12px 0"><h3>Patient care status</h3>${badge(p.level)}<p><b>Reason:</b> ${p.reasons.map(esc).join(' ')}</p>${p.diagnosis?`<p>Diagnosis confirmed by PHC: <b>${esc(p.diagnosis)}</b></p>`:'<p class="mut">No diagnosis confirmed yet. Screening does not itself confirm a diagnosis.</p>'}${p.gap?`<div class="warn">🔴 Care gap detected: ${esc(p.gap)}</div>`:''}${p.reason?`<p>Care gap identified: <b>${esc(p.reason)}</b></p>`:''}<p>💊 ${medb(p.med)} · Adherence: ${esc(p.adherence)}</p><p class="mut">Care-coordination priority — not a diagnosis or clinical risk score.</p></div>
 <div class="row" style="margin-bottom:12px">${phc?'':`<a class="btn" style="text-decoration:none;display:inline-flex;align-items:center" href="#/visit/${p.id}">+ Add Visit</a><button class="btn o" onclick="contact('${p.id}','${esc(p.phoneFull)}')">Contact Patient</button><button class="btn o" onclick="refer('${p.id}')">Create PHC Review Request</button>`}</div><div id="side"></div>
 ${p.plan?`<div class="card" style="border-color:var(--acc)"><h3>🩺 PHC clinical plan <span class="b STABLE">PHC-only</span></h3>Prescription: ${esc(p.plan.prescription)||'—'}<br>Next review: ${esc(p.plan.nextReview)||'—'}<br>Instructions for ASHA: ${esc(p.plan.instructions)||'—'}<br><small class="mut">Set by ${esc(p.plan.by)} on ${p.plan.date}. ASHA workers cannot change prescriptions.</small></div>`:''}
 ${phc?`<form class="card" id="cf" style="border-color:var(--acc);margin-top:12px"><h3>🩺 Clinical Assessment <span class="b STABLE">PHC-only</span></h3><label>Diagnosis</label><select name="diagnosis"><option>Not confirmed</option><option>Hypertension</option><option>Diabetes</option><option>Hypertension + Diabetes</option><option>Other</option></select><label>Prescription / treatment plan</label><textarea name="prescription" maxlength="400"></textarea><label>Next review date</label><input type="date" name="nextReview"><label>Instructions for ASHA</label><textarea name="instructions" maxlength="400"></textarea><div id="ce"></div><button class="btn">Save Clinical Plan</button></form>`:''}
 <div class="grid g2" style="margin-top:12px">${chart(p.bpHist,['sys','dia'],'BP trend','mmHg')}${chart(p.gluHist,['value'],'Glucose trend','mg/dL')}</div>${(()=>{const l=p.bpHist[p.bpHist.length-1];return l&&(l.sys>=140||l.dia>=90)?`<div class="warn">This pattern may require clinical review according to the configured PHC protocol. <b>PHC Review Recommended.</b></div>`:''})()}<p class="mut">Review this patient's readings according to PHC protocol.</p>
 <div class="card"><b>Glucose log</b>${p.gluHist.slice(-5).map(g=>`<div>${g.date} · ${g.value} mg/dL · ${esc(g.context)} · ${esc(g.by)}</div>`).join('')||' —'}</div>
 <h3 style="margin-top:16px">Patient journey</h3><div class="card">${timeline(p.timeline)}</div>
 <h3>Audit log</h3><div class="card">${p.audit.map(a=>`<div><small>${new Date(a.t).toLocaleTimeString()} — ${esc(a.user)}: ${esc(a.action)}${a.prev||a.next?` (${esc(a.prev)||'—'} → ${esc(a.next)})`:''}</small></div>`).join('')||'<small class="mut">No changes recorded yet.</small>'}</div>`,'patients');
 const cf=$('#cf');if(cf)cf.onsubmit=async e=>{e.preventDefault();try{await api('POST',`/patients/${id}/clinical`,Object.fromEntries(new FormData(cf)));toast('✓ Clinical plan saved');patient(id)}catch(er){$('#ce').innerHTML=`<div class="err">${esc(er.error)}</div>`}}
 }catch(e){shell(errS(e,'route()'),'patients')}}
function contact(id,ph){const kn='ನಿಮ್ಮ ಆರೋಗ್ಯ ತಪಾಸಣೆಯ ಸಮಯ ಸಮೀಪಿಸುತ್ತಿದೆ. ದಯವಿಟ್ಟು PHC ಅನ್ನು ಸಂಪರ್ಕಿಸಿ.',M={English:'Your health follow-up is due. Please contact or visit your PHC according to your care plan.',ಕನ್ನಡ:kn,हिन्दी:'आपकी स्वास्थ्य जाँच का समय नज़दीक है। कृपया अपने PHC से संपर्क करें।'};
 $('#side').innerHTML=`<div class="card"><h3>Contact Patient</h3><label>Method</label><select id="cm"><option>Phone call</option><option>SMS</option><option>Voice reminder</option></select><label>Language</label><select id="cl">${Object.keys(M).map(k=>`<option>${k}</option>`).join('')}</select><p id="cmsg" class="card mut"></p><button class="btn" id="cs">Send Reminder</button> <button class="btn o" onclick="$('#side').innerHTML=''">Cancel</button></div>`;
 const up=()=>$('#cmsg').textContent='“'+M[$('#cl').value]+'”';$('#cl').onchange=up;up();$('#cs').onclick=async()=>{try{await saveOrQueue('POST',`/patients/${id}/remind`,{method:$('#cm').value,lang:$('#cl').value});$('#side').innerHTML='';toast('✓ Reminder sent successfully (simulated)');patient(id)}catch(e){toast(e.error)}}}
function refer(id){$('#side').innerHTML=`<div class="card"><h3>PHC Review Request</h3><label>Reason</label><input id="rr" maxlength="200" placeholder="e.g. Repeated concerning readings"><label>Notes</label><textarea id="rn" maxlength="300"></textarea><button class="btn" id="rs">Send to PHC</button> <button class="btn o" onclick="$('#side').innerHTML=''">Cancel</button></div>`;$('#rs').onclick=async()=>{try{await saveOrQueue('POST',`/patients/${id}/referral`,{reason:$('#rr').value,notes:$('#rn').value});toast('✓ Review request sent');patient(id)}catch(e){toast(e.error)}}}
// ---- visit form ----
function visit(id){shell(`<a href="#/p/${id}">← Back</a><h1>Add Visit</h1><p class="mut">Aim for 1–2 minutes. You cannot change prescriptions — record information for the PHC.</p>
<form id="vf"><div class="card"><h3>🎙️ Voice note (optional)</h3><textarea id="vn" placeholder="Speak or type: Patient BP was 148 over 92 today and medicine was missed for two days because tablets were unavailable."></textarea><button type="button" class="btn s o" id="mic">🎤 Speak</button> <button type="button" class="btn s" id="parse">Draft from note</button><div id="draft"></div></div>
<div class="card" style="margin-top:12px"><h3>1 · Vitals</h3><div class="grid"><div><label>BP systolic</label><input name="sys" type="number" inputmode="numeric"></div><div><label>BP diastolic</label><input name="dia" type="number" inputmode="numeric"></div><div><label>Glucose (mg/dL)</label><input name="glucose" type="number" inputmode="numeric"></div></div><label>Measurement context</label><select name="context"><option>Fasting</option><option>Post-meal</option><option>Random</option></select><div id="vw"></div></div>
<div class="card" style="margin-top:12px"><h3>2 · Medication adherence</h3><select name="adherence"><option value="">Select…</option><option>Taking regularly</option><option>Missed occasionally</option><option>Missed frequently</option><option>Stopped</option><option>Medicine unavailable</option><option>Unknown</option></select><div id="rw" hidden><label>3 · Reason (care gap)</label><select name="reason"><option value="">Select…</option>${['Forgot medicine','Medicine unavailable','Cost/access issue','Side effects reported','Feels better','Difficulty reaching PHC/pharmacy','Does not understand instructions','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div><label>4 · Medicine availability</label><select name="med"><option value="">Select…</option><option>Available</option><option>Running low</option><option>Not available</option><option>Unknown</option></select></div>
<div class="card" style="margin-top:12px"><h3>5 · Follow-up</h3><label><input type="checkbox" name="followUp" style="width:auto;min-height:0"> Follow-up required</label><input type="date" name="followDate"><input name="purpose" placeholder="Follow-up purpose" maxlength="100"><h3>6 · PHC review</h3><label><input type="checkbox" name="phcReview" style="width:auto;min-height:0"> PHC review required</label><input name="reviewReason" placeholder="Reason" maxlength="200"><textarea name="notes" placeholder="Note" maxlength="300"></textarea></div><div id="ve"></div><button class="btn" style="width:100%;margin-top:12px">Save Visit</button></form>`,'patients');
 const f=$('#vf');f.adherence.onchange=()=>$('#rw').hidden=!['Missed occasionally','Missed frequently','Stopped','Medicine unavailable'].includes(f.adherence.value);
 const chk=()=>{const s=+f.sys.value,d=+f.dia.value,g=+f.glucose.value,w=[];if((f.sys.value||f.dia.value)&&!(s>=60&&s<=260&&d>=30&&d<=160&&s>d))w.push('<div class="err">Please enter a valid blood pressure reading.</div>');else if(s>=140||d>=90)w.push('<div class="warn">⚠️ This reading may require clinical review according to PHC protocol.</div>');if(g&&(g<30||g>600))w.push('<div class="err">Please enter a valid glucose value (mg/dL).</div>');else if(g>=200)w.push('<div class="warn">⚠️ This reading may require clinical review according to PHC protocol.</div>');$('#vw').innerHTML=w.join('')};['sys','dia','glucose'].forEach(n=>f[n].oninput=chk);
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;$('#mic').onclick=()=>{if(!SR)return toast('Voice input not supported in this browser — type the note instead.');const r=new SR();r.lang='en-IN';r.onresult=e=>$('#vn').value=e.results[0][0].transcript;r.start()};
 $('#parse').onclick=()=>{const t=$('#vn').value,d={},m=t.match(/(\d{2,3})\s*(?:over|\/)\s*(\d{2,3})/i);if(m){d.sys=m[1];d.dia=m[2]}if(/miss|forgot|skipp/i.test(t))d.adherence='Missed occasionally';if(/stopp/i.test(t))d.adherence='Stopped';if(/unavailab|not available|no tablets|out of/i.test(t)){d.reason='Medicine unavailable';d.med='Not available';d.adherence=d.adherence||'Medicine unavailable'}
  $('#draft').innerHTML=Object.keys(d).length?`<div class="card" style="margin-top:8px"><b>Detected information — please verify</b><br>${d.sys?`BP: ${d.sys}/${d.dia}<br>`:''}${d.adherence?`Medication adherence: ${d.adherence}<br>`:''}${d.reason?`Reason: ${d.reason}<br>`:''}<button type="button" class="btn s" id="cfm">Confirm & Save</button> <button type="button" class="btn s o" onclick="$('#draft').innerHTML=''">Edit</button></div>`:'<div class="warn">Nothing detected. Please fill the form manually.</div>';
  const c=$('#cfm');if(c)c.onclick=()=>{Object.entries(d).forEach(([k,v])=>f[k]&&(f[k].value=v));f.adherence.onchange();chk();$('#draft').innerHTML='<div class="ok b">Draft applied to form — review, then Save Visit.</div>'}};
 f.onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(f));b.followUp=f.followUp.checked;b.phcReview=f.phcReview.checked;try{const r=await saveOrQueue('POST',`/patients/${id}/visit`,b);toast((r.warnings||[]).join(' ')||'✓ Visit saved');location.hash='#/p/'+id}catch(er){$('#ve').innerHTML=`<div class="err" role="alert">${esc(er.error)} Your information has not been lost. <button class="btn s o" type="submit">Retry</button></div>`}}}
// ---- register ----
function register(){let st=1,d={};const draw=()=>{shell(`<h1>Register New Patient</h1><p class="mut">Step ${st} of 3</p>`+(st===1?`<form class="card" id="r1"><label>Full name</label><input name="name" required maxlength="80"><label>Age</label><input name="age" type="number" required><label>Gender</label><select name="gender"><option>Female</option><option>Male</option><option>Other</option></select><label>Mobile number</label><input name="phone" inputmode="numeric" pattern="[6-9][0-9]{9}" required><label>Household / address</label><input name="address" maxlength="120"><label>Emergency contact (optional)</label><input name="emergency"><div id="e"></div><button class="btn">Next</button></form>`
 :st===2?`<form class="card" id="r2"><div class="warn">Screening identifies people who may require further clinical assessment. Screening does not itself confirm a diagnosis.</div><div class="grid"><div><label>Systolic</label><input name="sys" type="number"></div><div><label>Diastolic</label><input name="dia" type="number"></div><div><label>Glucose (mg/dL)</label><input name="glucose" type="number"></div></div><label>Glucose context</label><select name="context"><option>Fasting</option><option>Post-meal</option><option>Random</option></select><label><input type="checkbox" name="knownHTN" style="width:auto;min-height:0"> Known hypertension</label><br><label><input type="checkbox" name="knownDM" style="width:auto;min-height:0"> Known diabetes</label><label>Symptoms / notes</label><textarea name="notes" maxlength="300" placeholder="e.g. headache, thirst"></textarea><div id="e"></div><button class="btn">Create Patient</button></form>`
 :`<div class="card"><h2>✓ Patient created</h2><p>Patient ID: <b>${d.id}</b><br>Patient Name: ${esc(d.name)}</p>${d.needsReview?'<span class="b ATTENTION">🟠 PHC Review Required</span><p>Screening information indicates that further clinical assessment may be appropriate. This is not a diagnosis.</p>':'<span class="b STABLE">🟢 No outstanding task</span>'}<a class="btn" style="text-decoration:none;display:inline-flex;align-items:center" href="#/p/${d.id}">View Patient</a> <a class="btn o" style="text-decoration:none;display:inline-flex;align-items:center" href="#/dash">Return to Dashboard</a></div>`),'patients');
 const f1=$('#r1'),f2=$('#r2');if(f1)f1.onsubmit=e=>{e.preventDefault();d={...d,...Object.fromEntries(new FormData(f1))};st=2;draw()};
 if(f2)f2.onsubmit=async e=>{e.preventDefault();const b={...d,...Object.fromEntries(new FormData(f2)),knownHTN:f2.knownHTN.checked,knownDM:f2.knownDM.checked,clientId:d.clientId||uid()};d.clientId=b.clientId;try{const r=await saveOrQueue('POST','/patients',b);if(r.queued){location.hash='#/dash';return}d={...d,...r};st=3;draw()}catch(er){$('#e').innerHTML=`<div class="err" role="alert">${esc(er.error)}</div>`}}};draw()}
// ---- router ----
const PUB=['','/','/login'];
async function route(){const h=(location.hash||'#/').slice(1).split('?')[0];if(!PUB.includes(h)&&!T){location.hash='#/login';return}
 if(h===''||h==='/')return landing();if(h==='/login')return login();
 const R={'/dash':dash,'/patients':()=>patients(),'/priority':()=>patients('high'),'/followups':followups,'/queue':queue,'/referrals':referrals,'/gaps':gaps,'/meds':meds,'/analytics':analytics,'/notes':notes,'/profile':profilePage,'/workers':workers,'/register':register};
 if(h.startsWith('/p/'))return patient(h.slice(3));if(h.startsWith('/visit/'))return visit(h.slice(7));(R[h]||dash)()}
addEventListener('hashchange',route);route();
</script></body></html>
